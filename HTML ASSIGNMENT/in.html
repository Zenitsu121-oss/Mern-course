<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
.switch{
    position: relative;
    display: inline-block;
    width: 50px;
    height: 26px;
}

.switch input{
    opacity: 0;
    width: 0;
    height: 0;
}

.slider{
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #ccc;
    border-radius: 30px;
    transition: .4s;
}

.slider::before{
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    border-radius: 50%;
    transition: .4s;
}

input:checked + .slider{
    background-color: #ff6154;
}

input:checked + .slider::before{
    transform: translateX(24px);
}
    </style>
</head>
<body>
       <label class="switch">
    <input type="checkbox">
    <span class="slider"></span>
</body>
</html>
