    <title>Comparison operator</title>
</head>
<body>
    <h1>Comparison operator</h1>



    <script>
        //And operator
        //first false
        console.log("AND Operator ---->",  5 && 0 && 5 &&7)

        console.log("AND Operator ---->",null && null && 0)


        console.log("AND Operator -------->",4 && 5 && 6 )

        //OR operator

        console.log("OR Operator -->", 8 || 6 || 8);

        console.log("OR Operator -->", 0 || null || null);

        console.log("OR Operator -->", 8 || 0 || 8);


        //Not opeerator


        console.log("Not Operator -->",!(5==3));

        console.log("Not Operator --->",!(5==5));
        
        //nullish coalsuing 


        let a=10;

        console.log("Nullish coalsuing --->",b ?? null ?? a)


        

    </script>
