    <title>COmparison Operator</title>

<body>
    <h1>Comparison Operator</h1>



    <script>
            let num1,num2 ,num3,num4;
            num1=60;
            num2=70;
            num3=50;
            num4=60;

            console.log("Grater than --->",num1>num2);

            console.log("Less than ----->",num1<num2);

            console.log("Grater than or equal to ------>",num1>=num4);

            console.log("Lesss than or equal to ------>",num2<=num3);

            console.log("Not equal ------->",num3!=num4);


            console.log("Strict equal to ----->",num1 === num4);
            
            
            


            



    </script>
