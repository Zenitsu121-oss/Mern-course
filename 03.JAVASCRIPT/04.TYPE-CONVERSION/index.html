<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tYPE CONVERSION</title>
</head>
<body>
    <H1>TYPES CONVERSION</H1>





    <script>
        //number to string


        let val=34;

        console.log("before---->",val)
        console.log("before---->",typeof val)


        let numTo=String(val)

        console.log("after---->",numTo)
        console.log("after---->",typeof numTo)


        //boolean to string

        let qus=true;

        console.log("before---->",qus)
        console.log("before---->",typeof qus)

        let ans=String(qus);

        console.log("after---->",ans)
        console.log("after---->", typeof ans)



        



    </script>
</body>
</html>
