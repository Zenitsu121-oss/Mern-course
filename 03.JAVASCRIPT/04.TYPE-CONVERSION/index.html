<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tYPE CONVERSION</title>
</head>
<body>
    <H1>TYPES CONVERSION</H1>





    <script>
        //number to string


        let val=34;

        console.log("before---->",val)
        console.log("before---->",typeof val)


        let numTo=String(val)

        console.log("after---->",numTo)
        console.log("after---->",typeof numTo)


        //boolean to string

        let qus=true;

        console.log("before---->",qus)
        console.log("before---->",typeof qus)

        let ans=String(qus);

        console.log("after---->",ans)
        console.log("after---->", typeof ans)


        console.log("----------------------------------")
        
        //string to number

        let isCrt="dinesh"
        console.log("before---->",isCrt)
        console.log("before---->",typeof isCrt)

        let isConver=Number(isCrt)
        console.log("after---->",isConver)
        console.log("after---->",typeof isConver)

         let isStr="dinesh123"
        console.log("before---->",isStr)
        console.log("before---->",typeof isStr)

        let isCover=Number(isStr)
        console.log("after---->",isCover)
        console.log("after---->",typeof isCover)



        //boolean to number
        
        let isBol=true
        console.log("before---->",isBol)
        console.log("before---->",typeof isBol)

        let isA=Number(isBol)
        console.log("after---->",isA)
        console.log("after---->",typeof isA)

        //null to number
        let noValue=null;
        console.log("before---->",noValue)
        console.log("before---->",typeof noValue)

        
        let isValue=Number(noValue)
        console.log("after---->",isValue)
        console.log("after---->",typeof isValue)

        //undefind to number

        let hey;
        console.log("before---->",hey)
        console.log("before---->",typeof hey)

        let hi=Number(hey);
        console.log("after---->",hi)
        console.log("after---->",typeof hi)



    </script>
</body>
</html>
