<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOPS</title>
</head>
<body>
    <h1>LOOPS</h1>

    <script>
        //while


        let a=1;

        while(a<=10){
            console.log("Print the first 10 number --->",a);
            a++;            

        }

        let b=1;

        while(b<=100){
            if(b%3==0 && b%5==0){
                console.log("print the even number -->",b);
            }
            
            b++;
            
        }


        //do...while


        let c=1

        do{
            console.log("print the first number",c);
            c++
        }
        while(c<=10)

         let d=1

        do{
            console.log("start with two number",d);
            d++
        }
        while(d>=3 && d<=10)

    </script>
</body>
</html>
