<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Animated Website</title>

  <link rel="stylesheet" href="index.css">
</head>

<body>

  <!-- Navigation -->
  <nav class="navbar">
    <h2 class="logo">Dinesh.</h2>

    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>


  <!-- Home Section -->
  <section id="home" class="hero">

    <div class="hero-content">
      <p class="intro">Hello, I'm</p>

      <h1>Dinesh</h1>

      <h2>MERN Stack Developer</h2>

      <p class="description">
        I create modern and interactive websites.
      </p>

      <button id="exploreBtn">
        Explore More
      </button>
    </div>

  </section>


  <!-- About Section -->
  <section id="about" class="about">

    <h2>About Me</h2>

    <p>
      I am a passionate web developer interested in creating
      beautiful and responsive web applications.
    </p>

  </section>


  <!-- Contact Section -->
  <section id="contact" class="contact">

    <h2>Contact Me</h2>

    <p>Email: example@email.com</p>

    <button class="contact-btn">
      Get In Touch
    </button>

  </section>


  <!-- Footer -->
  <footer>
    <p>© 2026 Dinesh. All Rights Reserved.</p>
  </footer>


  <script src="index.js"></script>

</body>
</html>
