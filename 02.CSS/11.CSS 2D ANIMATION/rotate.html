<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTATE ANIMATION</title>
    <style>
        .box{
            width: 300px;
            height: 300px;
            background-color: chartreuse;
            margin: 0 auto;
        }
        .box:hover{
            transform: rotate(150deg);
        }
    </style>
</head>
<body>
    <h1>ROTATE</h1>
    <div class="box"></div>
</body>
</html>
