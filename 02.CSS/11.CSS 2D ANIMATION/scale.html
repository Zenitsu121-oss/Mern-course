<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCALE 2D ANIMATION</title>
        <style>
            .box{
                width: 300px;
                height: 300px;
                background-color: darkgreen;
                margin: 0 auto;
            }
            .box:hover{
                        transform: scale(0.5,1.2) translate(100px,200px) rotate(200deg);           
                     }
        </style>
</head>
<body>
    <H1> SCALE ANIMATION</H1>
    <div class="box"></div>

</body>
</html>
